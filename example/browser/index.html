<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nodeless playground</title>
    <link rel="stylesheet" href="./playground.css" />
    <!--
      The nodeless dist imports esbuild-wasm, resolve.exports, semver and fflate by
      name. The import map resolves all four with no bundling step on this page.
    -->
    <script type="importmap">
      {
        "imports": {
          "esbuild-wasm": "https://unpkg.com/esbuild-wasm@0.25.12/esm/browser.min.js",
          "resolve.exports": "https://esm.sh/resolve.exports@2.0.3",
          "semver": "https://esm.sh/semver@7.8.5",
          "fflate": "https://esm.sh/fflate@0.8.3"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>nodeless</strong>
        <span>playground</span>
      </div>
      <div class="spacer"></div>
      <span class="pill" id="status" data-state="busy">starting</span>
      <label class="toggle">
        <input type="checkbox" id="auto" checked />
        build on change
      </label>
      <button class="primary" id="build" disabled>Build <kbd>⌘↵</kbd></button>
    </header>

    <main>
      <section class="panel">
        <div class="panel-bar" id="tabs" role="tablist"></div>
        <div id="editor"></div>
      </section>

      <section class="panel">
        <div class="panel-bar">
          <div class="chrome">
            <div class="dots"><i></i><i></i><i></i></div>
            <span class="url">preview</span>
          </div>
        </div>
        <div id="preview-host">
          <div class="placeholder" id="placeholder">waiting for the first build…</div>
        </div>
      </section>
    </main>

    <footer>
      <div class="status-line" id="meta"></div>
      <div class="diagnostics" id="diagnostics" hidden></div>
    </footer>

    <script type="module" src="./playground.js"></script>
  </body>
</html>
