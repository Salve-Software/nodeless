<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nodeless — the same code, in the browser</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        background: #0b0d10;
        color: #e6e8eb;
        display: grid;
        font-family: ui-sans-serif, system-ui, sans-serif;
        gap: 1rem;
        grid-template-rows: auto 1fr;
        height: 100vh;
        margin: 0;
        padding: 1rem;
      }
      header {
        display: flex;
        align-items: baseline;
        gap: 1rem;
      }
      h1 {
        font-size: 1rem;
        margin: 0;
      }
      #status {
        color: #8b93a1;
        font-size: 0.85rem;
      }
      #status[data-state='error'] {
        color: #ff6b6b;
        white-space: pre-wrap;
      }
      main {
        display: grid;
        gap: 1rem;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
      }
      textarea,
      iframe {
        background: #14181d;
        border: 1px solid #2b3038;
        border-radius: 8px;
        height: 100%;
        width: 100%;
      }
      textarea {
        color: inherit;
        font-family: ui-monospace, monospace;
        padding: 1rem;
        resize: none;
      }
      iframe {
        background: #fff;
      }
    </style>
    <!--
      The nodeless dist imports `esbuild-wasm` and `resolve.exports` by name.
      The import map resolves both with no bundling step on this page.
    -->
    <script type="importmap">
      {
        "imports": {
          "esbuild-wasm": "https://esm.sh/esbuild-wasm@^0.25.10",
          "resolve.exports": "https://esm.sh/resolve.exports@^2.0.3"
        }
      }
    </script>
  </head>
  <body>
    <header>
      <h1>nodeless in the browser</h1>
      <span id="status">loading…</span>
    </header>
    <main>
      <textarea id="editor" spellcheck="false"></textarea>
      <iframe id="preview" title="preview"></iframe>
    </main>

    <script type="module">
      import * as esbuild from 'esbuild-wasm';
      // Exactly the same `dist/` the product API consumes in Node.
      import { NodelessProject } from '../../dist/index.js';

      const EDITED_FILE = '/src/App.tsx';
      const status = document.getElementById('status');
      const editor = document.getElementById('editor');
      const preview = document.getElementById('preview');

      // `npm run example` writes this file — the snapshot an API would ship to the front end.
      const snapshot = await fetch('./snapshot.json').then((response) => response.json());

      const project = new NodelessProject({
        snapshot,
        wasmURL: `https://unpkg.com/esbuild-wasm@${esbuild.version}/esbuild.wasm`,
      });

      editor.value = project.vfs.readText(EDITED_FILE);
      editor.addEventListener('input', () => {
        project.vfs.writeFile(EDITED_FILE, editor.value);
      });

      project.watch(render);
      await render();

      async function render() {
        status.dataset.state = 'building';
        status.textContent = 'building…';

        const result = await project.build({ mode: 'development' });

        if (!result.ok) {
          status.dataset.state = 'error';
          status.textContent = result.errors
            .map((error) => `${error.file ?? ''}:${error.line ?? 0} ${error.text}`)
            .join('\n');
          return;
        }

        status.dataset.state = 'ok';
        status.textContent = `${result.durationMs} ms`;
        preview.srcdoc = inlineAssets(result.files);
      }

      /** The iframe cannot see the VFS: assets become Blob URLs inside the HTML. */
      function inlineAssets(files) {
        let html = new TextDecoder().decode(files['index.html']);

        for (const name of ['bundle.js', 'bundle.css']) {
          if (!files[name]) continue;
          html = html.replace(`./${name}`, URL.createObjectURL(new Blob([files[name]])));
        }

        return html;
      }
    </script>
  </body>
</html>
