name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `tsconfig.build.json` runs with `types: []`. This is the step that breaks if a
      # file under `src/` starts depending on a Node global.
      - name: Typecheck
        run: npm run typecheck

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The example is the fixture: if it stops building, CI breaks.
      - name: Example — build example/app and check the dist
        run: npm run example

      # The only end-to-end proof of the installer: it really talks to registry.npmjs.org
      # and really bundles Radix, lucide, zustand, react-router, date-fns and zod.
      - name: Example — install from the registry and build
        run: npm run example:install

      # Proves Tailwind runs through the cssTransform seam without the library
      # ever depending on tailwindcss or postcss.
      - name: Example — build with tailwind through the css transform
        run: npm run example:tailwind

  browser:
    name: Browser
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The only proof the browser path works: it opens the playground in a real
      # Chromium, installs from registry.npmjs.org over CORS, builds, and checks the
      # iframe actually executes the bundle.
      - name: Playground — install, build and run in a real browser
        run: npm run example:browser:test
